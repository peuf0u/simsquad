# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: simsquad

before:
  hooks:
    - go mod tidy

builds:
  - id: simsquad
    main: ./cmd/simsquad
    binary: simsquad
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}

archives:
  - id: simsquad
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"

brews:
  - name: simsquad
    # Publishes to peuf0u/homebrew-tap (`brew install peuf0u/tap/simsquad`).
    # Needs the HOMEBREW_TAP_GITHUB_TOKEN secret: a PAT with push access to
    # the tap.
    repository:
      owner: peuf0u
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/peuf0u/simsquad
    description: "Single-binary device-pool provisioner for parallel mobile QA."
    license: MIT
    # mobilecli drives devices for agent testing (ADR 0002). The tap ships
    # its formula, pinned to a tested mobile-next release.
    dependencies:
      - name: peuf0u/tap/mobilecli
    install: |
      bin.install "simsquad"
    test: |
      system "#{bin}/simsquad", "--version"
